name: Docker Build (PR)

on:
  pull_request:
    paths:
      - 'docker/**'
      - 'trendradar/**'
      - '.github/workflows/docker-pr.yml'
      - 'mcp_server/**'
      - 'pyproject.toml'
      - 'uv.lock'

concurrency:
  group: docker-pr-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host

      - name: Build (no push)
        uses: docker/build-push-action@v6
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          build-args: |
            PTILOPSIS_BUILD_COMMIT=${{ github.event.pull_request.head.sha }}
            PTILOPSIS_BUILD_ID=${{ github.run_id }}-${{ github.run_attempt }}
            PTILOPSIS_DEPLOYMENT_IMAGE_NAME=ptilopsis-radar:pr-${{ github.event.number }}
          cache-from: type=gha,scope=crawler
          cache-to: type=gha,scope=crawler,mode=max

  build-mcp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host

      - name: Build (no push)
        uses: docker/build-push-action@v6
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: ./docker/Dockerfile.mcp
          push: false
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,scope=mcp,mode=max
