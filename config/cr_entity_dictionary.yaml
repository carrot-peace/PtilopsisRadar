# ═══════════════════════════════════════════════════════════════
#        Ptilopsis Radar 跨语言实体词典（CR Rule 4 跨源聚类）
#                          Version: 1.0.0
# ═══════════════════════════════════════════════════════════════
#
# 用途：中文热榜标题与英文 RSS 标题的"拉丁/数字实体重叠"匹配（cluster.py Rule 4）。
#
# 重要：
#   - 这是 CR 聚类层的数据文件，与 config.yaml 无关；缺失/解析失败时聚类按"无词典"降级，不报错。
#   - dictionary：中文 -> 英文实体（v1 仅 string）。value 必须是与抽取器输出对齐的【单 token】、
#     小写。例如 "european union" / "sk hynix" 不会命中（抽取会切成多 token），取判别 token "eu"/"hynix"。
#   - dictionary 的 key 使用【子串匹配】（zh in title），不做 CJK 词边界判定。选 key 时务必避免它
#     作为更长词的子串误命中标题：如 "苹果" 会命中 "苹果醋"、"欧盟" 会命中无关含 "盟" 的词。
#     宁可选更具体的 key（"特斯拉" 而非 "特"）。V3b 的 ≥2 高区分度门控可抑制单次误注入，但仍应规避。
#   - 已知召回欠债：value 是单 token，英文标题不以该 token 字面出现就漏（如 "European Union" 不含
#     "EU" 时，欧盟→eu 不命中）。这是有意的 v1 取舍；后续按生产 miss 日志补条目，勿臆测扩大覆盖。
#   - stoplist：高频低区分度实体（小写）。这些实体不计入"高区分度"判定，单凭它们不能触发合并。
#   - 维护：从生产"抽到热门拉丁实体却没匹配上"的日志反推补条目，人工 review 走 PR（带外、不入热路径）。
# ═══════════════════════════════════════════════════════════════

# 中文 -> 英文实体（单 token，小写）
