services:
  trendradar:
    image: wantcat/trendradar:latest
    container_name: trendradar
    restart: unless-stopped

    ports:
      - "127.0.0.1:${WEBSERVER_PORT:-8080}:${WEBSERVER_PORT:-8080}"

    volumes:
      - ../config:/app/config:ro
      - ../output:/app/output

    environment:
      - TZ=${TZ:-Asia/Shanghai}
      # Web 服务器
      - WEBSERVER_PORT=${WEBSERVER_PORT:-8080}
      # One Bot identity shared by owner alerts, CR/DR and subscriptions
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_OWNER_CHAT_IDS=${TELEGRAM_OWNER_CHAT_IDS:-}
      - TELEGRAM_API_BASE_URL=${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      - TELEGRAM_TIMEOUT_SECONDS=${TELEGRAM_TIMEOUT_SECONDS:-10}
      - PTILOPSIS_TELEGRAM_SUBSCRIPTIONS_ENABLED=${PTILOPSIS_TELEGRAM_SUBSCRIPTIONS_ENABLED:-0}
      - PTILOPSIS_TELEGRAM_SUBSCRIPTION_DB_PATH=${PTILOPSIS_TELEGRAM_SUBSCRIPTION_DB_PATH:-output/meta/telegram-subscriptions.sqlite3}
      # AI 配置（ai_analysis 和 ai_translation 共享模型配置）
      - AI_ANALYSIS_ENABLED=${AI_ANALYSIS_ENABLED:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_API_BASE=${AI_API_BASE:-}
      # DR / 信息环境日报的独立输出预算（不影响翻译等其他 AI 功能）
      - AI_ANALYSIS_MAX_OUTPUT_TOKENS=${AI_ANALYSIS_MAX_OUTPUT_TOKENS:-}
      - AI_ANALYSIS_MAX_EVENTS=${AI_ANALYSIS_MAX_EVENTS:-}
      - AI_ANALYSIS_BATCH_MAX_EVIDENCE=${AI_ANALYSIS_BATCH_MAX_EVIDENCE:-}
      # 远程存储配置（S3 兼容协议）
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_REGION=${S3_REGION:-}
      # 运行模式
      - CRON_SCHEDULE=${CRON_SCHEDULE:-*/30 * * * *}
      - RUN_MODE=${RUN_MODE:-cron}
      - IMMEDIATE_RUN=${IMMEDIATE_RUN:-true}
      # CR-A 推送管线模式: off / artifact / shadow / live
      - PTILOPSIS_CR_DISPATCH_MODE=${PTILOPSIS_CR_DISPATCH_MODE:-off}
      - PTILOPSIS_CR_TELEGRAM_SEND=${PTILOPSIS_CR_TELEGRAM_SEND:-0}
      - PTILOPSIS_CR_TELEGRAM_PARSE_MODE=${PTILOPSIS_CR_TELEGRAM_PARSE_MODE:-}
      - PTILOPSIS_CR_TELEGRAM_DISABLE_WEB_PAGE_PREVIEW=${PTILOPSIS_CR_TELEGRAM_DISABLE_WEB_PAGE_PREVIEW:-true}
      # DR 推送管线模式: off / artifact / live
      - PTILOPSIS_DR_DISPATCH_MODE=${PTILOPSIS_DR_DISPATCH_MODE:-off}
      - PTILOPSIS_DR_TELEGRAM_SEND=${PTILOPSIS_DR_TELEGRAM_SEND:-0}
      - PTILOPSIS_DR_TELEGRAM_ATTACH_HTML=${PTILOPSIS_DR_TELEGRAM_ATTACH_HTML:-1}
      - PTILOPSIS_DR_TELEGRAM_PARSE_MODE=${PTILOPSIS_DR_TELEGRAM_PARSE_MODE:-HTML}

  trendradar-mcp:
    image: wantcat/trendradar-mcp:latest
    container_name: trendradar-mcp
    restart: unless-stopped

    ports:
      - "${MCP_HOST:-127.0.0.1}:${MCP_PORT:-3333}:3333"

    volumes:
      - ../config:/app/config:ro
      - ../output:/app/output

    environment:
      - TZ=Asia/Shanghai
      - MCP_PORT=${MCP_PORT:-3333}
